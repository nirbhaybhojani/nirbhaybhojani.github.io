<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nirbhay Bhojani — RF & IC Design Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
:root {
  --c-bg: #0a0d0f;
  --c-card: #141920;
  --c-border: #1e2830;
  --c-accent: #00e5c8;
  --c-text: #c8d8e8;
  --c-heading: #e8f4ff;
  --font-mono: 'Share Tech Mono', monospace;
  --font-body: 'DM Sans', sans-serif;
}

body {
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--font-body);
  margin: 0;
}

/* NAV */
.nav {
  display: flex;
  justify-content: space-between;
  padding: 1rem 4vw;
  border-bottom: 1px solid var(--c-border);
}

/* HERO */
.hero {
  padding: 4rem 4vw;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 3rem;
}

.hero-name {
  font-family: var(--font-mono);
  font-size: 3rem;
  color: var(--c-heading);
}

.hero-role {
  font-family: var(--font-mono);
  color: var(--c-accent);
  margin-top: 0.5rem;
}

.hero-right {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}

/* PHOTO STYLE */
.hero-photo {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--c-accent);
}

/* STATS */
.hero-stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.hero-stat-card {
  background: var(--c-card);
  padding: 10px;
  border-top: 3px solid var(--c-accent);
}

.hero-stat-val {
  font-family: var(--font-mono);
  color: var(--c-accent);
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div>NIRBHAY BHOJANI</div>
</div>

<!-- HERO -->
<div class="hero">

  <!-- LEFT -->
  <div>
    <div class="hero-name">Nirbhay <span style="color:#00e5c8;">Bhojani</span></div>
    <div class="hero-role">
      RF Systems · RFIC · Antenna · Metasurfaces
    </div>
  </div>

  <!-- RIGHT -->
  <div class="hero-right">

    <!-- ✅ YOUR PHOTO GOES HERE -->
    <img class="hero-photo"
         src="PASTE_YOUR_BASE64_IMAGE_HERE" />

    <!-- STATS -->
    <div class="hero-stat-grid">
      <div class="hero-stat-card">
        <div class="hero-stat-val">9.84</div>
        <div>CGPA</div>
      </div>
      <div class="hero-stat-card">
        <div class="hero-stat-val">Rank 1</div>
        <div>ECE</div>
      </div>
    </div>

  </div>

</div>

</body>
</html>
